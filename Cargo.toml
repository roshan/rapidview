[workspace]
resolver = "2"
members = [".", "markdown-core", "markview"]

[package]
name = "rapid-view"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9"

[dependencies.objc2]
version = "0.6"

[dependencies.objc2-foundation]
version = "0.3"
features = [
    "NSString",
    "NSArray",
    "NSDictionary",
    "NSUserDefaults",
    "NSAttributedString",
    "NSNotification",
    "NSTimer",
    "NSRunLoop",
    "NSURL",
    "NSError",
    "NSGeometry",
    "NSObjCRuntime",
    "NSRange",
    "NSValue",
    "NSThread",
]


[dependencies.objc2-app-kit]
version = "0.3"
features = [
    "NSApplication",
    "NSResponder",
    "NSWindow",
    "NSView",
    "NSMenu",
    "NSMenuItem",
    "NSRunningApplication",
    "NSScreen",
    "NSEvent",
    "NSColor",
    "NSGraphics",
    "NSPasteboard",
    "NSTextField",
    "NSControl",
    "NSScrollView",
    "NSClipView",
    "NSFont",
    "NSFontDescriptor",
    "NSFontManager",
    "NSButton",
    "NSImage",
    "NSStackView",
    "NSLayoutConstraint",
    "NSLayoutAnchor",
    "NSOpenPanel",
    "NSSavePanel",
    "NSPanel",
    "NSTrackingArea",
    "NSCursor",
    "NSAttributedString",
    "NSStringDrawing",
    "NSParagraphStyle",
    "NSText",
    "NSTextView",
    "NSProgressIndicator",
]

[dependencies.objc2-core-text]
version = "0.3"
features = [
    "CTLine",
    "CTFont",
    "CTStringAttributes",
    "CTFontDescriptor",
]

[dependencies.objc2-core-graphics]
version = "0.3"
features = [
    "CGContext",
    "CGColor",
    "CGColorSpace",
    "CGGeometry",
    "CGAffineTransform",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
incremental = false

[profile.release.package."*"]
opt-level = 3
