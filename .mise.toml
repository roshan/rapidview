[tasks.deploy]
description = "Build, ad-hoc sign, and install Rapid View.app into /Applications"
run = """
set -euo pipefail

app_name="Rapid View.app"
target_dir="${CARGO_TARGET_DIR:-target}"
src="${target_dir}/release/${app_name}"
dest="/Applications/${app_name}"

./bundle.sh release

codesign --force --deep --sign - "$src"

if [ -d "$dest" ]; then
  rm -rf "$dest" 2>/dev/null || sudo rm -rf "$dest"
fi

ditto "$src" "$dest" 2>/dev/null || sudo ditto "$src" "$dest"
codesign --verify --deep --strict "$dest"
echo "Installed $dest"
"""

[tasks.deploy-markview]
description = "Build, ad-hoc sign, and install Markview.app into /Applications"
run = """
set -euo pipefail

app_name="Markview.app"
target_dir="${CARGO_TARGET_DIR:-target}"
src="${target_dir}/release/${app_name}"
dest="/Applications/${app_name}"

./markview/bundle.sh release

codesign --force --deep --sign - "$src"

if [ -d "$dest" ]; then
  rm -rf "$dest" 2>/dev/null || sudo rm -rf "$dest"
fi

ditto "$src" "$dest" 2>/dev/null || sudo ditto "$src" "$dest"
codesign --verify --deep --strict "$dest"
echo "Installed $dest"
"""

[tasks.deploy-all]
description = "Deploy both Rapid View and Markview"
depends = ["deploy", "deploy-markview"]
